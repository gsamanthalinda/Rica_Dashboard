components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
      required:
        - email
        - password
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          default: bearer
      required:
        - access_token
        - token_type
    ChallengeResponse:
      type: object
      properties:
        challenge_id:
          type: string
        expires_in:
          type: integer
          description: Lifetime of the code in seconds
        detail:
          type: string
      required:
        - challenge_id
        - expires_in
        - detail
    VerifyLoginRequest:
      type: object
      properties:
        challenge_id:
          type: string
        code:
          type: string
          pattern: ^[0-9]{6}$
      required:
        - challenge_id
        - code
    UserResponse:
      type: object
      properties:
        user_id:
          type: string
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        role:
          type: string
          example: operations_manager
        account_status:
          type: string
          enum:
            - pending
            - active
            - disabled
      required:
        - user_id
        - email
        - first_name
        - last_name
        - role
        - account_status
    ErrorResponse:
      type: object
      properties:
        detail:
          description: Human readable reason the request was rejected
          oneOf:
            - type: string
            - type: array
              items:
                type: object
                properties:
                  msg:
                    type: string
                  message:
                    type: string
      required:
        - detail
