openapi: 3.1.0
info:
  title: Rica API
  version: 0.1.0
  description:
    "Contract between the Rica Next.js frontend and the FastAPI backend

    (`heliks-backend`).


    The frontend never calls the backend directly: `next.config.ts` rewrites

    `/auth/*` and `/users/*` to the address in `BACKEND_URL`, so the browser

    only ever talks to the Next.js origin.


    The backend serves the same document at `/openapi.json` and renders it at

    `/docs`; this file is the checked-in copy of the endpoints this app uses.

    "
  license:
    name: UNLICENSED
servers:
  - url: http://127.0.0.1:8000
    description: Local backend (set BACKEND_URL to change it)
tags:
  - name: auth
  - name: mfa
  - name: password-reset
  - name: activation
  - name: users
paths:
  /auth/login:
    post:
      tags:
        - auth
      summary: Sign in with email and password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in, access token returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "202":
          description:
            "Email MFA is enabled for this account: a verification code was

            emailed and `challenge_id` must be sent to

            `/auth/mfa/verify-login`.

            "
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeResponse"
        "401":
          description: Invalid credentials, or the account is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The account exists but has not been activated yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many attempts, try again later
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      tags:
        - auth
      summary: Blacklist the current access token
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Token blacklisted
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                required:
                  - detail
        "401":
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/mfa/verify-login:
    post:
      tags:
        - mfa
      summary: Verify the emailed login code
      operationId: verifyLoginCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyLoginRequest"
      responses:
        "200":
          description: Code accepted, access token returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Invalid or expired verification code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/mfa/resend:
    post:
      tags:
        - mfa
      summary: Send the login code again
      operationId: resendLoginCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyLoginRequest"
      responses:
        "200":
          description: A new code was emailed
          content:
            application/json:
              schema:
                type: object
                properties:
                  challenge_id:
                    type: string
                  expires_in:
                    type: integer
                    description: Lifetime of the code in seconds
                required:
                  - challenge_id
                  - expires_in
        "400":
          description: The challenge is unknown or already used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/forgot-password:
    post:
      tags:
        - password-reset
      summary: Request a password reset code
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required:
                - email
              additionalProperties: false
      responses:
        "200":
          description:
            "A reset code was emailed. The same message is returned for unknown

            addresses so the endpoint cannot be used to enumerate accounts.

            "
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
  /auth/reset/verify:
    post:
      tags:
        - password-reset
      summary: Verify the reset code and get a reset token
      operationId: verifyResetCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                  pattern: ^[0-9]{6}$
                  description: The 6-digit code from the email
              required:
                - email
                - code
              additionalProperties: false
      responses:
        "200":
          description: Code accepted, reset token returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: Single use token, valid for one hour
                required:
                  - token
        "400":
          description: Invalid, expired or locked reset code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/reset-password:
    post:
      tags:
        - password-reset
      summary: Set a new password with a reset token
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                new_password:
                  type: string
                  minLength: 8
              required:
                - token
                - new_password
              additionalProperties: false
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
        "400":
          description: The reset token is invalid, expired or already used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/activate:
    post:
      tags:
        - activation
      summary: Activate an account with the emailed code
      operationId: activateAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  minLength: 6
                  maxLength: 6
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                confirm_password:
                  type: string
                  minLength: 8
                  maxLength: 128
                email:
                  type: string
                  format: email
                  description: Optional, the address the code was sent to. This app sends the code alone.
              required:
                - code
                - password
                - confirm_password
              additionalProperties: false
      responses:
        "200":
          description: Account activated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
        "400":
          description: Invalid or expired activation code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/activate/resend:
    post:
      tags:
        - activation
      summary: Send a new activation code
      operationId: resendActivationCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required:
                - email
              additionalProperties: false
      responses:
        "200":
          description: A new code was emailed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  expires_in:
                    type: integer
                    description: Lifetime of the code in seconds
                required:
                  - message
                  - expires_in
        "400":
          description: The address is unknown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /users:
    get:
      tags:
        - users
      summary: List users
      operationId: listUsers
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The users of the system
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/UserResponse"
                  total:
                    type: integer
                required:
                  - users
                  - total
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /users/me:
    get:
      tags:
        - users
      summary: The signed in user
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profile of the account the token belongs to
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: Missing, expired or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /processing-stages:
    get:
      tags:
        - Processing Stages
      summary: List Processing Stages
      operationId: list_processing_stages_processing_stages_get
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/ProcessingStageResponse"
                type: array
                title: Response List Processing Stages Processing Stages Get
    post:
      tags:
        - Processing Stages
      summary: Create Processing Stage
      operationId: create_processing_stage_processing_stages_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessingStageCreate"
        required: true
      responses:
        "201":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessingStageResponse"
        "409":
          description: Duplicate name/order, or stage in use
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /processing-stages/{stage_id}:
    get:
      tags:
        - Processing Stages
      summary: Get Processing Stage
      operationId: get_processing_stage_processing_stages__stage_id__get
      parameters:
        - name: stage_id
          in: path
          required: true
          schema:
            type: integer
            maximum: 32767
            exclusiveMinimum: 0
            title: Stage Id
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessingStageResponse"
        "404":
          description: Processing stage not found
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
    patch:
      tags:
        - Processing Stages
      summary: Update Processing Stage
      operationId: update_processing_stage_processing_stages__stage_id__patch
      parameters:
        - name: stage_id
          in: path
          required: true
          schema:
            type: integer
            maximum: 32767
            exclusiveMinimum: 0
            title: Stage Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessingStageUpdate"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessingStageResponse"
        "404":
          description: Processing stage not found
        "409":
          description: Duplicate name/order, or stage in use
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
    delete:
      tags:
        - Processing Stages
      summary: Delete Processing Stage
      operationId: delete_processing_stage_processing_stages__stage_id__delete
      parameters:
        - name: stage_id
          in: path
          required: true
          schema:
            type: integer
            maximum: 32767
            exclusiveMinimum: 0
            title: Stage Id
      responses:
        "204":
          description: Successful Response
        "404":
          description: Processing stage not found
        "409":
          description: Duplicate name/order, or stage in use
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /scenario-results/{results_id}:
    get:
      tags:
        - Scenario Results
      summary: Get Scenario Result
      operationId: get_scenario_result_scenario_results__results_id__get
      parameters:
        - name: results_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Results Id
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/schemas__scenario_results__ScenarioResultResponse"
        "404":
          description: Scenario or result not found
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /scenarios/{scenario_id}/results:
    get:
      tags:
        - Scenario Results
      summary: List Scenario Results
      operationId: list_scenario_results_scenarios__scenario_id__results_get
      parameters:
        - name: scenario_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Scenario Id
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/schemas__scenario_results__ScenarioResultResponse"
                title: Response List Scenario Results Scenarios  Scenario Id  Results Get
        "404":
          description: Scenario or result not found
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /scenarios/{scenario_id}/results/{execution_number}:
    get:
      tags:
        - Scenario Results
      summary: Get Scenario Execution
      operationId: get_scenario_execution_scenarios__scenario_id__results__execution_number__get
      parameters:
        - name: scenario_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Scenario Id
        - name: execution_number
          in: path
          required: true
          schema:
            type: integer
            exclusiveMinimum: 0
            title: Execution Number
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/schemas__scenario_results__ScenarioResultResponse"
        "404":
          description: Scenario or result not found
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /values/batches/{batch_id}/calculate:
    post:
      summary: Calculate Batch Value
      operationId: calculate_batch_value_values_batches__batch_id__calculate_post
      parameters:
        - name: batch_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Batch Id
      responses:
        "201":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValueCalculationResponse"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /values/batches/{batch_id}/values:
    get:
      summary: Get Values For Batch
      operationId: get_values_for_batch_values_batches__batch_id__values_get
      parameters:
        - name: batch_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Batch Id
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ValueCalculationResponse"
                title: Response Get Values For Batch Values Batches  Batch Id  Values Get
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /values/history/{history_id}/values:
    get:
      summary: Get Values For History
      operationId: get_values_for_history_values_history__history_id__values_get
      parameters:
        - name: history_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: History Id
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ValueCalculationResponse"
                title: Response Get Values For History Values History  History Id  Values Get
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /scenarios/:
    post:
      tags:
        - Scenarios
      summary: Create Scenario
      operationId: create_scenario_scenarios__post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScenarioCreate"
      responses:
        "201":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioResponse"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
    get:
      tags:
        - Scenarios
      summary: List Scenarios
      operationId: list_scenarios_scenarios__get
      parameters:
        - name: batch_id
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                format: uuid
              - type: "null"
            title: Batch Id
        - name: created_by
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                format: uuid
              - type: "null"
            title: Created By
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScenarioResponse"
                title: Response List Scenarios Scenarios  Get
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /scenarios/{scenario_id}:
    get:
      tags:
        - Scenarios
      summary: Get Scenario
      operationId: get_scenario_scenarios__scenario_id__get
      parameters:
        - name: scenario_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Scenario Id
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioResponse"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
    put:
      tags:
        - Scenarios
      summary: Update Scenario
      operationId: update_scenario_scenarios__scenario_id__put
      parameters:
        - name: scenario_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Scenario Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScenarioUpdate"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioResponse"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
    delete:
      tags:
        - Scenarios
      summary: Delete Scenario
      operationId: delete_scenario_scenarios__scenario_id__delete
      parameters:
        - name: scenario_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Scenario Id
      responses:
        "204":
          description: Successful Response
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /scenarios/{scenario_id}/execute:
    post:
      tags:
        - Scenarios
      summary: Execute Scenario
      operationId: execute_scenario_scenarios__scenario_id__execute_post
      parameters:
        - name: scenario_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Scenario Id
      responses:
        "201":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/schemas__scenario__ScenarioResultResponse"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /mineral-batches:
    post:
      tags:
        - Mineral Batches
      summary: Register Mineral Batch
      operationId: register_mineral_batch_mineral_batches_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MineralBatchCreate"
      responses:
        "201":
          description: Successful Response
          content:
            application/json:
              schema: {}
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
    get:
      tags:
        - Mineral Batches
      summary: Get All Mineral Batches
      operationId: get_all_mineral_batches_mineral_batches_get
      parameters:
        - name: sort
          in: query
          required: false
          schema:
            type: string
            pattern: ^(asc|desc)$
            default: desc
            title: Sort
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MineralBatchResponse"
                title: Response Get All Mineral Batches Mineral Batches Get
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /mineral-batches/search:
    get:
      tags:
        - Mineral Batches
      summary: Search Mineral Batches
      operationId: search_mineral_batches_mineral_batches_search_get
      parameters:
        - name: batch_code
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            title: Batch Code
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MineralBatchResponse"
                title: Response Search Mineral Batches Mineral Batches Search Get
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /mineral-batches/code/{batch_code}:
    get:
      tags:
        - Mineral Batches
      summary: Get Mineral Batch By Code
      operationId: get_mineral_batch_by_code_mineral_batches_code__batch_code__get
      parameters:
        - name: batch_code
          in: path
          required: true
          schema:
            type: string
            title: Batch Code
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MineralBatchResponse"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /mineral-batches/code/{batch_code}/qr-code:
    get:
      tags:
        - Mineral Batches
      summary: Get Mineral Batch Qr Code
      operationId: get_mineral_batch_qr_code_mineral_batches_code__batch_code__qr_code_get
      parameters:
        - name: batch_code
          in: path
          required: true
          schema:
            type: string
            title: Batch Code
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema: {}
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /mineral-batches/{batch_id}/upload-assay:
    put:
      tags:
        - Mineral Batches
      summary: Upload Assay Document
      operationId: upload_assay_document_mineral_batches__batch_id__upload_assay_put
      parameters:
        - name: batch_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Batch Id
      requestBody:
